version: '3.9'

services:

  # ── MongoDB Database ─────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: crm_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - crm_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend API Server ───────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: crm_server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/crm_leads
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - crm_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Frontend (React + Nginx) ─────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: crm_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - crm_net

volumes:
  mongo_data:
    driver: local

networks:
  crm_net:
    driver: bridge
