services:
  # ── Backend Web Service (Express API, Webhooks, AI Scoring) ──────────────────
  - type: web
    name: worthprime-crm-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

  # ── Frontend Static Site (React 19 + Vite + Glassmorphic UI) ─────────────────
  - type: web
    name: worthprime-crm-dashboard
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: worthprime-crm-api
          property: host
